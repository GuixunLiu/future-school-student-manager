plugins {
    id 'com.android.application'
}

android {
    namespace 'cn.mashangchengzhang.studentmanager'
    compileSdk 35
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'cn.mashangchengzhang.studentmanager'
        minSdk 24
        targetSdk 35
        versionCode 69
        versionName '4.8.6-lesson-review'

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    lint {
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'org.opencv:opencv:4.12.0'
}
