plugins {
    id 'com.android.application'
}

def classboardCompat = providers.gradleProperty('classboardCompat').isPresent()

android {
    namespace 'cn.mashangchengzhang.studentmanager'
    compileSdk 35
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'cn.mashangchengzhang.studentmanager'
        minSdk 24
        targetSdk 35
        versionCode classboardCompat ? 87 : 85
        versionName classboardCompat ? '4.12.5-classboard-layout' : '4.12.4-sync-recovery'

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.synctest'
            versionNameSuffix '-isolated-test'
            resValue 'string', 'app_name', '未来学校同步测试（独立）'
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    lint {
        checkReleaseBuilds false
    }
    buildFeatures { buildConfig true }
    // Same candidate JS sources in Node tests and Android assets; no copied fork.
    sourceSets.main.assets.srcDir(rootProject.file('server/management/tablet'))
    if (classboardCompat) {
        def compatAssets = layout.buildDirectory.dir('generated/classboard-assets').get().asFile
        if (!new File(compatAssets, 'index.html').isFile()) {
            throw new GradleException('Run app/compat/classboard/prepare.py with esbuild first.')
        }
        sourceSets.release.assets.srcDir(compatAssets)
    }
}

dependencies {
    implementation 'org.opencv:opencv:4.12.0'
}
