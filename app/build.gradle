plugins {
    id 'com.android.application'
}

android {
    namespace 'cn.mashangchengzhang.studentmanager'
    compileSdk 35
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'cn.mashangchengzhang.studentmanager'
        minSdk 24
        targetSdk 35
        versionCode 82
        versionName '4.12.1-class-teachers'

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.synctest'
            versionNameSuffix '-isolated-test'
            resValue 'string', 'app_name', '未来学校同步测试（独立）'
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    lint {
        checkReleaseBuilds false
    }
    buildFeatures { buildConfig true }
    // Same candidate JS sources in Node tests and Android assets; no copied fork.
    sourceSets.main.assets.srcDir(rootProject.file('server/management/tablet'))
}

dependencies {
    implementation 'org.opencv:opencv:4.12.0'
}
