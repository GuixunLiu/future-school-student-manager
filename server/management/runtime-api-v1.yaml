openapi: 3.1.0
info:
  title: 未来学校统一业务 API
  version: 1.0.0-draft
  description: 最终三端范围契约草案。服务器是唯一数据中心；所有写操作支持幂等和审计。
servers:
  - url: /api
security:
  - userBearer: []
tags:
  - name: tablet
  - name: teacher
  - name: admin
  - name: wechat
paths:
  /health/ready:
    get:
      security: []
      operationId: readiness
      responses:
        '200': { $ref: '#/components/responses/Object' }
  /v1/auth/login:
    post:
      security: []
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [organization, login, password]
              properties:
                organization: { type: string, maxLength: 80 }
                login: { type: string, maxLength: 80 }
                password: { type: string, format: password, maxLength: 200 }
      responses:
        '200': { $ref: '#/components/responses/Object' }
        '401': { $ref: '#/components/responses/Error' }
  /v1/auth/logout:
    post:
      operationId: logout
      responses:
        '200': { $ref: '#/components/responses/Object' }
  /v1/me:
    get:
      operationId: currentIdentity
      responses:
        '200': { $ref: '#/components/responses/Object' }
  /v1/admin/devices:
    get:
      tags: [admin]
      operationId: adminListDevices
      responses:
        '200': { $ref: '#/components/responses/Object' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [admin]
      operationId: adminCreateDevice
      description: 创建待激活平板并签发15分钟一次性开通码；开通码不写入命令回执或审计。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, class_ids, command_ref]
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
                class_ids: { type: array, minItems: 1, maxItems: 200, uniqueItems: true, items: { type: string } }
                command_ref: { $ref: '#/components/schemas/EventRef' }
      responses:
        '200': { $ref: '#/components/responses/Object' }
        '201': { $ref: '#/components/responses/Object' }
        '403': { $ref: '#/components/responses/Error' }
  /v1/admin/devices/{device_id}/activation:
    post:
      tags: [admin]
      operationId: adminReissueDeviceActivation
      description: 作废旧设备凭据和未使用开通码，签发15分钟一次性开通码；重复回执不返回开通码。
      parameters:
        - name: device_id
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 80 }
      requestBody: { $ref: '#/components/requestBodies/AdminCommand' }
      responses:
        '200': { $ref: '#/components/responses/Object' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/admin/devices/{device_id}/disable:
    post:
      tags: [admin]
      operationId: adminDisableDevice
      description: 停用平板并撤销设备凭据和未使用开通码，不删除课堂、签到或课时数据。
      parameters:
        - name: device_id
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 80 }
      requestBody: { $ref: '#/components/requestBodies/AdminCommand' }
      responses:
        '200': { $ref: '#/components/responses/Object' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/tablet/activate:
    post:
      tags: [tablet]
      security: []
      operationId: tabletActivate
      description: 原生安全层使用一次性开通码换取设备凭据，令牌不进入页面脚本。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [activation_code]
              properties:
                activation_code: { type: string, pattern: '^wxa_[A-Za-z0-9_-]{43}$' }
      responses:
        '200': { $ref: '#/components/responses/Object' }
        '401': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }
  /v1/tablet/bootstrap:
    get:
      tags: [tablet]
      security: [{ deviceBearer: [] }]
      operationId: tabletBootstrap
      description: 返回设备获授权班级的课堂、学生及余额版本，不返回管理后台资料。
      responses:
        '200': { $ref: '#/components/responses/Object' }
        '403': { $ref: '#/components/responses/Error' }
  /v1/tablet/face-profiles:
    get:
      tags: [tablet]
      security: [{ deviceBearer: [] }]
      operationId: tabletFaceProfiles
      description: 仅向已授权平板返回其课堂投影内在读学生的有效 SFace 特征；服务器解密 AES-GCM 档案后经固定 pin 的 HTTPS 原生通道发送，不包含照片、授权凭证或其他班级资料。
      responses:
        '200': { $ref: '#/components/responses/Object' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/tablet/checkins:
    post:
      tags: [tablet]
      security: [{ deviceBearer: [] }]
      operationId: tabletCheckin
      description: 断网续传使用同一 event_ref；旧余额版本返回 409，绝不覆盖服务器余额。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TabletCheckin' }
      responses:
        '200': { $ref: '#/components/responses/Object' }
        '201': { $ref: '#/components/responses/Object' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/tablet/checkins/resolve:
    post:
      tags: [tablet]
      security: [{ deviceBearer: [] }]
      operationId: tabletResolveCheckin
      description: 网页已将同一课次处理为已到或请假后，返回当前服务器结果供平板归档；不新建签到、不扣课时，相同原报文安全重复。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TabletCheckin' }
      responses:
        '200': { $ref: '#/components/responses/Object' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /v1/teacher/lessons:
    get:
      tags: [teacher]
      operationId: teacherLessons
      description: 已实现。按北京时间日期返回当前教师同时获授课和班级授权的课堂；缺省为服务器当天。
      parameters:
        - { name: date, in: query, required: false, schema: { type: string, format: date, pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' } }
      responses:
        '200': { $ref: '#/components/responses/Object' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /v1/teacher/lessons/{lessonId}:
    get:
      tags: [teacher]
      operationId: teacherLesson
      parameters:
        - { $ref: '#/components/parameters/LessonId' }
      responses:
        '200': { $ref: '#/components/responses/Object' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/teacher/lessons/{lessonId}/face-checkin:
    post:
      tags: [teacher]
      operationId: teacherFaceCheckin
      description: 已实现。仅识别该教师本节课应到学生；浏览器连续采集3帧128维SFace特征而非原始照片，服务器比对并统一写入签到、课时流水和审计。仅限课堂当天且开始之后，首次201、相同内容安全重复200。
      parameters:
        - { $ref: '#/components/parameters/LessonId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [event_ref, model_version, descriptors]
              properties:
                event_ref: { $ref: '#/components/schemas/EventRef' }
                model_version: { type: string, minLength: 1, maxLength: 40, description: 当前为 sface-int8bq-v1 }
                descriptors:
                  type: array
                  minItems: 3
                  maxItems: 3
                  items:
                    type: array
                    minItems: 128
                    maxItems: 128
                    items: { type: number, description: 归一化且有限的人脸特征值 }
      responses:
        '200': { $ref: '#/components/responses/Object' }
        '201': { $ref: '#/components/responses/Object' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /v1/teacher/lessons/{lessonId}/makeup:
    post:
      tags: [teacher]
      operationId: teacherMakeup
      description: 已实现。仅本人授课班级；首次操作201，同一操作编号及内容的安全重复返回200。
      parameters:
        - { $ref: '#/components/parameters/LessonId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AttendanceCorrection' }
      responses:
        '200': { $ref: '#/components/responses/Object' }
        '201': { $ref: '#/components/responses/Object' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/teacher/lessons/{lessonId}/leave:
    post:
      tags: [teacher]
      operationId: teacherLeave
      description: 已实现。请假不扣课时；首次操作201，同一操作编号及内容的安全重复返回200。
      parameters:
        - { $ref: '#/components/parameters/LessonId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AttendanceCorrection' }
      responses:
        '200': { $ref: '#/components/responses/Object' }
        '201': { $ref: '#/components/responses/Object' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/teacher/students/{studentId}/balance:
    put:
      tags: [teacher]
      operationId: teacherAdjustBalance
      parameters:
        - { $ref: '#/components/parameters/StudentId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BalanceAdjustment' }
      responses:
        '200': { $ref: '#/components/responses/Object' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/teacher/reports/weekly:
    get:
      tags: [teacher]
      operationId: teacherWeeklyReport
      description: 已实现。按北京时间自然周汇总本人课堂；实到除以已结束且未取消课堂的应到人次，请假计入应到，未结束课次单列。
      parameters:
        - { name: week_start, in: query, required: false, schema: { type: string, format: date, pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' }, description: 北京时间周一；缺省为服务器当前周 }
      responses:
        '200': { $ref: '#/components/responses/Object' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /v1/admin/students:
    get:
      tags: [admin]
      operationId: adminStudents
      description: 已实现。返回本机构学生、当前班级、最新课时余额和余额版本，供管理员续费核对；不向教师或设备凭据开放。
      responses:
        '200': { $ref: '#/components/responses/Object' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [admin]
      operationId: adminCreateStudent
      description: 已实现。管理员创建在读学生并指定当前班级；学生、期初余额、不可变期初流水、招新记录、审计在同一事务内创建。学号和业务来源编号在机构内唯一，操作编号安全重试不重复建档。不回填历史签到，不修改已生成课次的应到名单，不记录金额。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [class_id, name, external_ref, opening_units, occurred_at, source_ref, reason, command_ref]
              properties:
                class_id: { type: string, minLength: 1, maxLength: 80 }
                name: { type: string, minLength: 1, maxLength: 80 }
                external_ref: { type: string, minLength: 1, maxLength: 80 }
                opening_units: { type: integer, minimum: 0, maximum: 10000000 }
                occurred_at: { type: integer, minimum: 0, maximum: 253402185599, description: 北京时间业务发生时间对应的 Unix 秒；不得明显晚于服务器时间 }
                source_ref: { type: string, minLength: 1, maxLength: 100 }
                reason: { type: string, minLength: 1, maxLength: 200 }
                command_ref: { $ref: '#/components/schemas/EventRef' }
      responses:
        '200': { $ref: '#/components/responses/Object', description: 相同操作编号及内容的安全重复，不重复建档 }
        '201': { $ref: '#/components/responses/Object' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /v1/admin/students/{studentId}:
    put:
      tags: [admin]
      operationId: adminUpdateStudent
      description: 已实现。管理员编辑姓名、学号、学籍状态和当前班级，使用独立资料版本防止并发覆盖。转班或停用只移除未开始且无签到处理的旧班名单；转班或恢复在读时按目标班每节课规则加入未来名单，规则不一致则留待核对。已处理课次和招新记录保留当时班级快照，历史签到、余额和流水不变。
      parameters:
        - { $ref: '#/components/parameters/StudentId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [class_id, name, external_ref, active, expected_version, reason, command_ref]
              properties:
                class_id: { type: string, minLength: 1, maxLength: 80 }
                name: { type: string, minLength: 1, maxLength: 80 }
                external_ref: { type: string, minLength: 1, maxLength: 80 }
                active: { type: boolean }
                expected_version: { type: integer, minimum: 0 }
                reason: { type: string, minLength: 1, maxLength: 200 }
                command_ref: { $ref: '#/components/schemas/EventRef' }
      responses:
        '200': { $ref: '#/components/responses/Object' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /v1/admin/students/{studentId}/face-profile:
    put:
      tags: [admin]
      operationId: adminSaveFaceProfile
      description: 已实现。管理员核验监护人授权后为在读学生录入或替换人脸；三帧特征使用AES-GCM加密保存，不保存原始照片，重复操作不重复建档。
      parameters:
        - { $ref: '#/components/parameters/StudentId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [model_version, descriptors, consent_ref, command_ref]
              properties:
                model_version: { type: string, minLength: 1, maxLength: 40, description: 当前为 sface-int8bq-v1 }
                descriptors:
                  type: array
                  minItems: 3
                  maxItems: 3
                  items:
                    type: array
                    minItems: 128
                    maxItems: 128
                    items: { type: number }
                consent_ref: { type: string, minLength: 1, maxLength: 100, description: 已核验的监护人授权凭证编号 }
                command_ref: { $ref: '#/components/schemas/EventRef' }
      responses:
        '200': { $ref: '#/components/responses/Object' }
        '201': { $ref: '#/components/responses/Object' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error', description: 未配置 FACE_PROFILE_KEY }
  /v1/admin/accounts:
    get:
      tags: [admin]
      operationId: adminAccounts
      description: 已实现。仅管理员可查看本机构纯教师账号的姓名、登录名、启停状态、资料版本、密码是否已配置及当前任课班级。不返回密码哈希、会话或其他秘密；管理员及双重角色账号不在此列表管理。
      responses:
        '200': { $ref: '#/components/responses/Object' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [admin]
      operationId: adminCreateAccount
      description: 已实现。管理员创建启用中的纯教师账号，登录名使用3至64位小写字母、数字、点、下划线或连字符，初始密码15至128位。用户、教师角色、独立密码哈希、资料版本0和审计在同一事务保存；首次201、安全重复200。接口、回执和审计不返回或记录明文密码，新账号不自动获得班级权限。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [login, display_name, password, reason, command_ref]
              properties:
                login: { type: string, minLength: 3, maxLength: 64, pattern: '^[a-z0-9][a-z0-9_.-]{2,63}$' }
                display_name: { type: string, minLength: 1, maxLength: 80 }
                password: { type: string, minLength: 15, maxLength: 128, writeOnly: true }
                reason: { type: string, minLength: 1, maxLength: 200 }
                command_ref: { $ref: '#/components/schemas/EventRef' }
      responses:
        '200': { $ref: '#/components/responses/Object', description: 安全重复返回原回执，不包含密码 }
        '201': { $ref: '#/components/responses/Object' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /v1/admin/accounts/{userId}/status:
    put:
      tags: [admin]
      operationId: adminSetAccountStatus
      description: 已实现。仅管理员可停用或恢复纯教师账号，必须提交最新资料版本、原因和固定操作编号。停用有任课班级的教师会被拒绝，须先交接；状态变化撤销该账号全部现有网页会话。恢复不自动授予班级。只改变账号状态、版本和会话，不删除账号，不改变任课、历史签到或课时账本；重复请求在版本检查前返回原回执。
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [active, expected_version, reason, command_ref]
              properties:
                active: { type: boolean }
                expected_version: { type: integer, minimum: 0 }
                reason: { type: string, minLength: 1, maxLength: 200 }
                command_ref: { $ref: '#/components/schemas/EventRef' }
      responses:
        '200': { $ref: '#/components/responses/Object' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /v1/admin/accounts/{userId}/password:
    put:
      tags: [admin]
      operationId: adminResetAccountPassword
      description: 已实现。仅管理员可重置纯教师账号密码，必须提交最新资料版本、原因和固定操作编号。保存新的独立加盐密码哈希并撤销全部现有网页会话；接口、回执和审计不返回或记录明文密码。不修改账号状态、任课关系、历史签到或课时账本；重复请求在版本检查前返回原回执。
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [password, expected_version, reason, command_ref]
              properties:
                password: { type: string, minLength: 15, maxLength: 128, writeOnly: true }
                expected_version: { type: integer, minimum: 0 }
                reason: { type: string, minLength: 1, maxLength: 200 }
                command_ref: { $ref: '#/components/schemas/EventRef' }
      responses:
        '200': { $ref: '#/components/responses/Object' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /v1/admin/teachers:
    get:
      tags: [admin]
      operationId: adminTeachers
      description: 已实现。仅管理员可查看本机构在职教师及其班级授权，用于开课排课；不返回密码、会话或其他凭据。
      responses:
        '200': { $ref: '#/components/responses/Object' }
        '403': { $ref: '#/components/responses/Error' }
